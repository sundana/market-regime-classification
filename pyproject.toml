[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-classification"
version = "0.2.0"
description = "Honest baseline for market regime detection: filtered HMM / GMM / vol-threshold with walk-forward economic evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "market regimes",
    "regime detection",
    "hidden markov model",
    "gaussian mixture",
    "quantitative finance",
    "walk-forward",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "yfinance>=0.2.40,<2",
]

[project.scripts]
market-regime = "market_regime_classification.run:main"
market-regime-score = "market_regime_classification.score:main"

[dependency-groups]
dev = [
    "mypy>=1.11,<3",
    "pandas-stubs>=2.3.3.260113,<4",
    "pytest>=8.0,<10",
    "ruff>=0.6,<1",
    "scikit-learn-stubs>=0.0.3,<0.1",
    "twine>=5.0,<8",
]

[tool.setuptools]
packages = ["market_regime_classification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["market_regime_classification"]
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]
