[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-classification"
version = "0.1.0"
description = "Honest baseline for market regime detection: filtered HMM / GMM / vol-threshold with walk-forward economic evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "market regimes",
    "regime detection",
    "hidden markov model",
    "gaussian mixture",
    "quantitative finance",
    "walk-forward",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
]

[project.scripts]
market-regime = "market_regime_classification.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "twine>=5.0",
]

[tool.setuptools]
packages = ["market_regime_classification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]
